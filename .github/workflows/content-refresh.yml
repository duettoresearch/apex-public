# Why: The site renders from a committed snapshot, so it goes stale the moment
# APEX moves on. Regenerating on a schedule and proposing the result as a pull
# request keeps the numbers current without giving the deployment any access to
# the private repositories, and keeps a human between a regenerated snapshot and
# a published one.
# What: Weekly (and on demand) clones both private sources with a read-only
# token, regenerates `src/generated/` and `public/schema/`, runs the leak gate,
# the tests, and the build, then opens or updates one pull request when the
# snapshot actually changed.
# Test: `actionlint .github/workflows/content-refresh.yml`
#
# The read credential comes from either a GitHub App (APEX_APP_ID +
# APEX_APP_PRIVATE_KEY, preferred) or the APEX_READ_TOKEN personal access token
# (fallback); LEAK_DENYLIST is required either way. The preflight step below
# names what is missing and says where to add it. The workflow fails loudly
# rather than silently producing a snapshot the leak gate never fully checked.
name: content-refresh

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # For `gh workflow run ci.yml` on the refresh branch, see the last step.
  actions: write

concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    env:
      # The private half of the leak denylist. `npm run content` refuses to
      # generate without it. That refusal is the fail-safe, not an obstacle:
      # generating with the generic patterns alone is exactly how a name would
      # reach the published site. LEAK_DENYLIST_OPTIONAL is never set here.
      LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
    steps:
      # The `secrets` context is not available in a step-level `if:`, so this
      # step maps the secrets into `env` and publishes `have_app` for the mint
      # step to gate on.
      - name: Preflight — required secrets
        id: preflight
        env:
          APEX_APP_ID: ${{ secrets.APEX_APP_ID }}
          APEX_APP_PRIVATE_KEY: ${{ secrets.APEX_APP_PRIVATE_KEY }}
          APEX_READ_TOKEN: ${{ secrets.APEX_READ_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          where='repository Settings → Secrets and variables → Actions → New repository secret'
          have_app=false
          if [ -n "${APEX_APP_ID:-}" ] && [ -n "${APEX_APP_PRIVATE_KEY:-}" ]; then
            have_app=true
          fi
          echo "have_app=${have_app}" >> "${GITHUB_OUTPUT}"
          if [ "${have_app}" = 'true' ]; then
            echo 'Source credential: app-token (GitHub App).'
          elif [ -n "${APEX_READ_TOKEN:-}" ]; then
            echo 'Source credential: pat (APEX_READ_TOKEN). Prefer a GitHub App — see the README.'
          else
            echo "::error::No read credential for the private sources. Add it under ${where}. Preferred: APEX_APP_ID and APEX_APP_PRIVATE_KEY for a GitHub App installed on duettoresearch/APEX and duettoresearch/apex-companion with Contents: read. Fallback: APEX_READ_TOKEN, a fine-grained personal access token with Contents: read on the same two repositories."
            missing=1
          fi
          if [ -z "${LEAK_DENYLIST:-}" ]; then
            echo "::error::Missing secret LEAK_DENYLIST. Add it under ${where}. It holds the private leak-gate tokens, newline- or comma-separated. Without it the content step refuses to generate, by design."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::content-refresh cannot run until the secrets above exist."
            exit 1
          fi
          echo 'Required secrets are present.'

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Mint app token (preferred credential)
        id: app
        if: steps.preflight.outputs.have_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APEX_APP_ID }}
          private-key: ${{ secrets.APEX_APP_PRIVATE_KEY }}
          owner: duettoresearch
          repositories: APEX,apex-companion

      # One place decides the credential, so the clone and the content step
      # cannot disagree about which one they used.
      - name: Resolve the read credential
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PAT: ${{ secrets.APEX_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            token="${APP_TOKEN}"
            source='app-token'
          else
            token="${PAT}"
            source='pat'
          fi
          echo "::add-mask::${token}"
          echo "APEX_TOKEN=${token}" >> "${GITHUB_ENV}"
          echo "Using ${source} to read the private sources."

      - name: Clone the private sources
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/apex-sources"
          mkdir -p "${dest}"
          for repo in APEX apex-companion; do
            # Default branch only, but full history: the stats read `rev-list`
            # and `shortlog`, which a shallow clone would undercount.
            git clone --single-branch \
              "https://x-access-token:${APEX_TOKEN}@github.com/duettoresearch/${repo}.git" \
              "${dest}/${repo}"
            # Drop the credential from the clone's config now that fetching is done.
            git -C "${dest}/${repo}" remote set-url origin \
              "https://github.com/duettoresearch/${repo}.git"
          done
          echo "APEX_REPO_PATH=${dest}/APEX" >> "${GITHUB_ENV}"
          echo "APEX_COMPANION_REPO_PATH=${dest}/apex-companion" >> "${GITHUB_ENV}"

      - name: Regenerate the snapshot
        env:
          # Lets the pipeline read the merged pull request count through `gh`.
          # Without a token that stat is omitted rather than guessed, and the
          # tile silently disappears from /stats on every scheduled run. An app
          # token qualifies when the app has Pull requests: read or Contents:
          # read; if the count comes back empty the field is simply omitted.
          GH_TOKEN: ${{ env.APEX_TOKEN }}
        run: npm run content

      - name: Leak gate
        run: npm run leak-check

      - name: Test
        run: npm test

      - name: Build and scan dist
        env:
          # Unset the sources so the content step inside `npm run build` no-ops.
          # The snapshot was generated one step ago; regenerating it here would
          # only cost minutes and risk a second, different result.
          APEX_REPO_PATH: ''
          APEX_COMPANION_REPO_PATH: ''
        run: npm run build

      - name: Detect content changes
        id: diff
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/generated public/schema)" ]; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            echo 'no content changes'
            exit 0
          fi
          # Intent-to-add so a newly generated file appears in `git diff --stat`.
          git add -N -- src/generated public/schema
          {
            echo 'changed=true'
            echo "today=$(date -u +%Y-%m-%d)"
            echo 'stat<<DIFFSTAT'
            git diff --stat -- src/generated public/schema
            echo 'DIFFSTAT'
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure the content-refresh label exists
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create content-refresh \
            --color 1D76DB \
            --description 'Scheduled snapshot refresh from the private APEX sources' \
            --force

      - name: Open or update the refresh pull request
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: content/auto-refresh
          add-paths: |
            src/generated
            public/schema
          commit-message: |
            content: refresh from APEX (${{ steps.diff.outputs.today }})

            🤖🤖🤖 Generated with trusty-mpm — https://github.com/bobmatnyc/trusty-tools
          title: 'content: refresh from APEX (${{ steps.diff.outputs.today }})'
          labels: content-refresh
          body: |
            Scheduled regeneration of `src/generated/` and `public/schema/` from
            `duettoresearch/APEX` and `duettoresearch/apex-companion`.

            This run already passed `npm run content`, `npm run leak-check`,
            `npm test`, and `npm run build` with the private denylist loaded.
            Read the diff for facts that changed, then merge — Vercel deploys
            `main`.

            ```
            ${{ steps.diff.outputs.stat }}
            ```

            🤖🤖🤖 Generated with trusty-mpm — https://github.com/bobmatnyc/trusty-tools

      # `ci` is the required check on `main`, and a pull request opened with
      # GITHUB_TOKEN does not start other workflows — so the refresh branch
      # would carry no `ci` check and could never merge. workflow_dispatch is
      # exempt from that rule, and check runs are keyed by the branch head SHA,
      # so dispatching `ci` against the branch resolves the context on the
      # pull request.
      - name: Dispatch ci against the refresh branch
        if: >-
          steps.pr.outputs.pull-request-operation == 'created' ||
          steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          if ! gh workflow run ci.yml --ref content/auto-refresh; then
            echo "::error::Could not dispatch ci against content/auto-refresh. The pull request is open but carries no ci check, so it cannot merge. Fallback: close and reopen ${PR_URL}, which starts ci on the branch."
            exit 1
          fi
          echo 'Dispatched ci against content/auto-refresh.'
